## The replacement body for `location / { … }` in
## ~/docker/nginx/nginx/site-confs/default.conf
##
## Only two things change from what is there now: the upstream moves from
## wiki:3000 to site:8080, and X-Auth-Tier is set.

location / {
    include /config/nginx/proxy.conf;
    include /config/nginx/resolver.conf;
    set $upstream_app site;
    set $upstream_port 8080;
    set $upstream_proto http;

    # Every proxying location sets this, so an inbound X-Auth-Tier from a client
    # is always overwritten and can never be trusted upward.
    proxy_set_header X-Auth-Tier public;

    proxy_pass $upstream_proto://$upstream_app:$upstream_port;
}
