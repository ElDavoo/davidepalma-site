## davidepalma.it — protected tiers
##
## Install as:  ~/docker/nginx/nginx/proxy-confs/davidepalma-site.subfolder.conf
##
## SWAG's default.conf already has `include /config/nginx/proxy-confs/*.subfolder.conf;`
## inside the server block, so these locations are picked up without editing it.
##
## nginx checks regex locations before the `/` prefix match regardless of file
## order, so these take precedence over the site's catch-all location.
##
## Create the password files first (bcrypt, and two SEPARATE files -- the point
## of the secret tier is that it does not share credentials with the private one):
##
##   docker exec -it nginx htpasswd -B -c /config/nginx/.htpasswd-private davide
##   docker exec -it nginx htpasswd -B -c /config/nginx/.htpasswd-secret  davide

location ~ ^/(?:[a-z]{2}/)?private(?:/|$) {
    auth_basic "Private";
    auth_basic_user_file /config/nginx/.htpasswd-private;

    include /config/nginx/proxy.conf;
    include /config/nginx/resolver.conf;
    set $upstream_app site;
    set $upstream_port 8080;
    set $upstream_proto http;

    # Set unconditionally, so a client sending its own X-Auth-Tier cannot forge
    # one: nginx overwrites whatever arrived. The server checks this against the
    # page's tier in the build manifest and refuses a mismatch, so a mistake in
    # either layer alone cannot serve protected content.
    proxy_set_header X-Auth-Tier private;

    proxy_pass $upstream_proto://$upstream_app:$upstream_port;
}

location ~ ^/(?:[a-z]{2}/)?secret(?:/|$) {
    auth_basic "Secret";
    auth_basic_user_file /config/nginx/.htpasswd-secret;

    include /config/nginx/proxy.conf;
    include /config/nginx/resolver.conf;
    set $upstream_app site;
    set $upstream_port 8080;
    set $upstream_proto http;

    proxy_set_header X-Auth-Tier secret;

    proxy_pass $upstream_proto://$upstream_app:$upstream_port;
}
