# Build, verify and publish the site image.
#
# The Eleventy build happens here rather than in the Dockerfile because it needs
# two things a docker build cannot easily reach: a Kroki server to render
# diagrams, and checkouts of both content repositories.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Both content repositories fire this when their markdown changes.
  repository_dispatch:
    types: [content-updated]
  # A daily rebuild keeps the image fresh even if a dispatch is ever missed.
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Lowercased: github.repository preserves the owner's capitalisation
  # (ElDavoo), and container tags must be lowercase.
  IMAGE_NAME: eldavoo/davidepalma-site

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      # The `secrets` context cannot be used in an `if:` condition, so the one
      # decision that depends on a secret's presence reads it from here.
      CONTENT_TOKEN: ${{ secrets.CONTENT_TOKEN }}

    services:
      # Kroki renders graphviz, plantuml, bytefield and friends itself, and
      # delegates mermaid to a companion container. Running our own instance
      # keeps the build independent of kroki.io -- whose public mermaid backend
      # is intermittently down -- and means no reader ever contacts a third
      # party for a diagram.
      kroki:
        image: yuzutech/kroki:latest
        env:
          KROKI_MERMAID_HOST: mermaid
          KROKI_MERMAID_PORT: 8002
        ports: ['8000:8000']
      mermaid:
        image: yuzutech/kroki-mermaid:latest
        ports: ['8002:8002']

    steps:
      - name: Check out the generator
        uses: actions/checkout@v7
        with:
          path: davidepalma-site

      - name: Check out public content
        uses: actions/checkout@v7
        with:
          repository: ElDavoo/wikijs-content
          path: wikijs-content

      - name: Check out private content
        # Guarded so the build can run before CONTENT_TOKEN exists. The next
        # step is what keeps that from being dangerous.
        if: env.CONTENT_TOKEN != ''
        uses: actions/checkout@v7
        with:
          repository: ElDavoo/wiki-content-private
          token: ${{ secrets.CONTENT_TOKEN }}
          path: wiki-content-private

      - name: Refuse to publish without private content
        # If CONTENT_TOKEN ever stops working, the build would otherwise succeed
        # and publish an image in which every private and secret page has
        # silently vanished into a 404. Fail instead.
        #
        # Set the repository variable ALLOW_MISSING_PRIVATE=true only to bootstrap
        # the first build, and remove it once the token is in place.
        run: |
          if [ -d wiki-content-private ] && [ -n "$(find wiki-content-private -name '*.md' -not -path '*/.*' -print -quit)" ]; then
            echo "private content: $(find wiki-content-private -name '*.md' -not -path '*/.*' | wc -l) file(s)"
            exit 0
          fi
          # A pull request from a fork gets no secrets, so it cannot check out
          # private content -- and it never pushes an image, so the failure this
          # guard exists to prevent cannot happen there.
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ vars.ALLOW_MISSING_PRIVATE }}" = "true" ]; then
            echo "::warning::Building WITHOUT private content (ALLOW_MISSING_PRIVATE is set). Private and secret pages will be absent from this image."
            mkdir -p wiki-content-private
            exit 0
          fi
          echo "::error::Private content is missing. Set the CONTENT_TOKEN secret, or set the repository variable ALLOW_MISSING_PRIVATE=true to build without it."
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: davidepalma-site/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: davidepalma-site/server/go.sum

      - run: npm ci
        working-directory: davidepalma-site

      # Diagrams are rendered once and cached by content hash, so an unchanged
      # diagram costs nothing on later builds.
      - name: Restore diagram cache
        uses: actions/cache@v6
        with:
          path: davidepalma-site/.cache/diagrams
          key: diagrams-${{ hashFiles('wikijs-content/**/*.md', 'wiki-content-private/**/*.md') }}
          restore-keys: diagrams-

      - name: Wait for Kroki
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/ >/dev/null; then echo "kroki up"; exit 0; fi
            sleep 2
          done
          echo "kroki did not become ready" >&2
          exit 1

      - name: Check mermaid rendering works
        # Fail fast and legibly here rather than deep inside the site build:
        # mermaid is the one diagram type that needs the companion container.
        run: |
          printf 'graph TD\n  A[Start] --> B[End]\n' > /tmp/m.mmd
          code=$(curl -s -o /tmp/m.svg -w '%{http_code}' --max-time 60 \
            -X POST -H 'Content-Type: text/plain' --data-binary @/tmp/m.mmd \
            http://localhost:8000/mermaid/svg)
          echo "mermaid -> HTTP $code, $(wc -c < /tmp/m.svg) bytes"
          test "$code" = "200"
          grep -q '<svg' /tmp/m.svg

      - name: Rendering parity against the wiki's own output
        working-directory: davidepalma-site
        env:
          # Check the markdown the site is actually built from, not the
          # migration snapshot (which is gitignored and only exists locally).
          CONTENT_PUBLIC: ${{ github.workspace }}/wikijs-content
          CONTENT_PRIVATE: ${{ github.workspace }}/wiki-content-private
        run: npm run parity

      - name: Build the site
        working-directory: davidepalma-site
        env:
          NODE_ENV: production
          KROKI_SERVER: http://localhost:8000
          DIAGRAMS_STRICT: '1'
          CONTENT_PUBLIC: ${{ github.workspace }}/wikijs-content
          CONTENT_PRIVATE: ${{ github.workspace }}/wiki-content-private
          UNLISTED_SALT: ${{ secrets.UNLISTED_SALT }}
        # --quiet: Eleventy otherwise logs the path of every file it writes,
        # which in a public log would list every private and secret page.
        run: npm run build -- --quiet

      - name: Assert no client-side JavaScript
        working-directory: davidepalma-site
        run: node tools/check-no-js.mjs _site

      - name: Assert every diagram rendered
        working-directory: davidepalma-site
        # DIAGRAMS_STRICT should already have failed the build, so this is a
        # backstop against the error placeholder reaching the image.
        run: |
          if grep -rq 'diagram-error' _site --include='*.html'; then
            echo "a diagram fell back to its source" >&2
            grep -rl 'diagram-error' _site --include='*.html' >&2
            exit 1
          fi
          echo "inlined SVG diagrams: $(grep -rlo 'class="diagram diagram-' _site --include='*.html' | wc -l) page(s)"

      - name: Check internal links
        working-directory: davidepalma-site
        # Warn-only: the wiki ships with pre-existing dead links and a missing
        # image, and a build should not fail on content defects it inherited.
        # --redact-protected keeps protected page paths out of a public log.
        run: node tools/check-links.mjs _site --warn --redact-protected

      - name: Go tests
        working-directory: davidepalma-site/server
        run: go test ./...

      - name: End-to-end verification
        working-directory: davidepalma-site
        run: node tools/verify.mjs

      - name: Stage the image payload
        working-directory: davidepalma-site
        run: node tools/stage-dist.mjs --in _site --out dist

      - name: Check the unlisted URLs are stable across rebuilds
        working-directory: davidepalma-site
        env:
          KROKI_SERVER: http://localhost:8000
          CONTENT_PUBLIC: ${{ github.workspace }}/wikijs-content
          CONTENT_PRIVATE: ${{ github.workspace }}/wiki-content-private
          UNLISTED_SALT: ${{ secrets.UNLISTED_SALT }}
        # An unlisted URL that changed between builds would break every link
        # anyone has been given, so this is checked rather than assumed.
        # Compares digests, never the URLs themselves: an unlisted URL printed
        # into a public build log is an unlisted URL no longer.
        run: |
          before=$(jq -Sc '[.pages[] | select(.tier == "unlisted") | .url]' dist/data/manifest.json | sha256sum)
          count=$(jq '[.pages[] | select(.tier == "unlisted")] | length' dist/data/manifest.json)
          npm run build -- --quiet >/dev/null
          after=$(jq -Sc '[.pages[] | select(.tier == "unlisted") | .url]' _site/manifest.json | sha256sum)
          if [ "$before" != "$after" ]; then
            echo "::error::unlisted URLs changed between two builds of the same content; every shared link would break"
            exit 1
          fi
          echo "unlisted URLs stable across rebuilds: $count page(s)"

      - name: Stage a publishable copy of the build
        working-directory: davidepalma-site
        # This repository is public, so workflow artifacts are downloadable by
        # anyone. dist/ holds every tier, and dist/data/manifest.json names every
        # private, secret and unlisted URL. Publish the public pages only.
        run: |
          rm -rf artifact
          cp -r dist/site artifact
          rm -rf artifact/secret artifact/private
          for locale in $(jq -r '.locales[]' dist/data/manifest.json); do
            rm -rf "artifact/$locale/private" "artifact/$locale/secret" "artifact/$locale/u"
          done
          # Fail rather than upload if anything protected survived.
          if jq -r '.pages[] | select(.tier != "public") | .file' dist/data/manifest.json \
             | while read -r f; do [ -e "artifact/$f" ] && echo "$f"; done | grep -q .; then
            echo "::error::a protected page survived staging; refusing to upload"
            exit 1
          fi
          echo "artifact: $(find artifact -type f | wc -l) public file(s)"

      - name: Upload the built site
        # Public pages only -- see the staging step above. Enough to inspect what
        # shipped, including the mermaid diagrams, without publishing any tier
        # that is meant to be gated.
        uses: actions/upload-artifact@v7
        with:
          name: site-public
          path: davidepalma-site/artifact
          retention-days: 14

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        if: github.event_name != 'pull_request'

      - name: Build and push the image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        env:
          # buildx otherwise uploads a build record artifact. Inspected once and
          # it carries no page content -- but it is an artifact on a public
          # repository whose shape is buildx's to change, and nothing here needs
          # it. Fewer things to re-audit on the next buildx bump.
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: davidepalma-site
          file: davidepalma-site/Dockerfile
          # The Pi is arm64; amd64 is there so the image can be run locally.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
