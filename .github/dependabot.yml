# Dependencies are kept current. Rendering parity is protected by a test, not by
# pinning.
#
# The markdown pipeline was originally pinned to the versions wiki.js uses,
# because this site's premise is that it renders what davidepalma.it renders
# today. Keeping current is the better trade: tools/parity-check.mjs compares
# every page against wiki.js's own stored output, so an upgrade that changes
# rendering fails CI and gets looked at rather than shipped.
#
# When a bump does change rendering, the choice is between restoring the old
# behaviour and accepting the new one. Both have happened:
#
#   - markdown-it 12 flipped linkify's `fuzzyLink` default to false, which
#     silently dropped a link on it/home. Restored explicitly in
#     src/markdown/pipeline.mjs.
#   - markdown-it-attrs 5 moved a trailing {.is-info} from the blockquote to the
#     paragraph inside it, which broke blockquote styling. Restored in
#     src/postprocess/blockquotes.mjs.
#   - KaTeX 0.18 fixed mhchem, so a chemistry equation that shows as the literal
#     "\ce" on the live wiki now renders. Accepted, and recorded as an intended
#     difference in tools/parity-check.mjs.
#
# So: read the parity failure before merging a rendering-library bump. It is
# telling you something real.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for the rendering stack: these are checked together by the parity
      # test, and reviewing them together is how you see the combined effect.
      markdown-pipeline:
        patterns:
          - markdown-it
          - markdown-it-*
          - katex
          - cheerio
          - uslug
          - twemoji
          - "@twemoji/*"
          - highlight.js

  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
